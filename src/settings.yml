---
id: 532429
name: Sniffnet Downloads
description: Hourly Sniffnet download stats.
strategy: static
refresh_interval: 60
refresh_interval_floor: 60
static_data: '{}'
no_screen_padding: 'no'
dark_mode: 'no'
framework_version: 3.4.4
custom_fields:
  - keyname: about
    field_type: author_bio
    name: About this plugin
    description: A serverless download dashboard for Sniffnet.
    github_url: https://github.com/GyulyVGC/sniffnet-downloads-trmnl-plugin
    learn_more_url: https://sniffnet.app
  - keyname: github_token
    field_type: password
    name: GitHub token (optional)
    optional: true
    description: A fine-grained read-only token avoids GitHub's shared unauthenticated rate limit.
    help_text: Leave blank first. Add a token only if GitHub reports rate-limit errors.
